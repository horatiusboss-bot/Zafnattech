<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zafnatech Stock</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3a5c">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#ffffff;--tx:#12202e;--mut:#5d6b7a;--pri:#0f3a5c;--prit:#ffffff;--acc:#f2a900;--bd:#d9dfe6;--err:#c62828;--key:#e6ebf1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#16222f;--tx:#eaf0f6;--mut:#9aa9b8;--pri:#6fb3ea;--prit:#0d1620;--acc:#f2b632;--bd:#27384a;--err:#ff7b72;--key:#1d2c3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#16222f;--tx:#eaf0f6;--mut:#9aa9b8;--pri:#6fb3ea;--prit:#0d1620;--acc:#f2b632;--bd:#27384a;--err:#ff7b72;--key:#1d2c3c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.lock{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{width:64px;height:64px;border-radius:16px;background:var(--pri);color:var(--prit);font-size:34px;font-weight:800;display:grid;place-items:center;margin-bottom:16px;border-bottom:5px solid var(--acc)}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px;min-height:24px}
.sub.err{color:var(--err);font-weight:600}
.dots{display:flex;gap:16px;margin-bottom:28px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}
.dots i.on{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border:0;border-radius:50%;background:var(--key);font-size:26px;font-weight:600}
.pad button:active{background:var(--bd)}
.link{margin-top:22px;background:none;border:0;color:var(--pri);font-weight:600;padding:10px}
.top{background:var(--pri);color:var(--prit);padding:14px 16px;font-weight:700;font-size:18px;border-bottom:4px solid var(--acc)}
main{padding:16px 16px 96px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;margin:0 0 6px}
.card p{margin:0;color:var(--mut)}
.btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 2px 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.in{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-weight:400}
#prod-root>.in{margin-bottom:10px}
.f{display:block;margin-bottom:14px;font-weight:600}
.btn.pri{background:var(--pri);color:var(--prit);border-color:var(--pri);text-align:center}
.btn.dng{color:var(--err);text-align:center}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer}
.item img,.ph{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.ph{background:var(--key);display:grid;place-items:center;font-size:30px}
.m{color:var(--mut);font-size:14px;margin:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--key);margin-top:4px}
.tag.warn{background:var(--acc);color:#12202e}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.th{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--err);color:#fff}
.row{display:flex;gap:8px;margin:8px 0}
.dl{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-weight:400}.dl span{flex:1}
.dl button{border:0;background:none;color:var(--err);font-size:20px}
.ft{font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.tile.w2{grid-column:span 2}
.tile span{display:block;color:var(--mut);font-size:13px}
.tile b{display:block;font-size:19px;margin-top:2px;overflow-wrap:anywhere}
.gt{font-weight:700;margin:18px 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
var app=document.getElementById("app");
var mem={},busy=false,unlocked=false,hiddenAt=0,fails=0,lockUntil=0;
var store={
 get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
 set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
};
function rnd(){var a=new Uint8Array(8);(window.crypto||{getRandomValues:function(x){for(var i=0;i<x.length;i++)x[i]=Math.random()*256}}).getRandomValues(a);return Array.prototype.map.call(a,function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
async function hash(pin,salt){
 var s=salt+":"+pin;
 try{
  var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("");
 }catch(e){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return"f"+h}
}
function saved(){try{return JSON.parse(store.get("zt_pin"))}catch(e){return null}}
async function check(pin){
 if(Date.now()<lockUntil)return{error:"Trop d’essais. Réessayez dans "+Math.ceil((lockUntil-Date.now())/1000)+" s."};
 var d=saved();
 if(d&&await hash(pin,d.s)===d.h){fails=0;return{ok:true}}
 fails++;
 if(fails>=5){fails=0;lockUntil=Date.now()+30000;return{error:"Trop d’essais. Réessayez dans 30 s."}}
 return{error:"PIN incorrect"};
}
function pad(title,sub,onDone,cancel,isErr){
 var v="";
 app.innerHTML='<div class="lock"><div class="logo">Z</div><h1>'+title+'</h1><p class="sub'+(isErr?' err':'')+'" id="sub">'+sub+'</p><div class="dots" id="dots"></div><div class="pad" id="pad"></div>'+(cancel?'<button class="link" id="cx">Annuler</button>':'')+'</div>';
 var dots=document.getElementById("dots"),subEl=document.getElementById("sub"),pd=document.getElementById("pad");
 function draw(){var h="";for(var i=0;i<4;i++)h+='<i class="'+(i<v.length?"on":"")+'"></i>';dots.innerHTML=h}
 draw();
 var keys=["1","2","3","4","5","6","7","8","9","","0","⌫"],h="";
 keys.forEach(function(k){h+=k?'<button data-k="'+k+'" aria-label="'+(k==="⌫"?"Effacer":k)+'">'+k+'</button>':"<span></span>"});
 pd.innerHTML=h;
 pd.onclick=async function(e){
  var k=e.target.getAttribute&&e.target.getAttribute("data-k");
  if(!k||busy)return;
  if(k==="⌫"){v=v.slice(0,-1);draw();return}
  if(v.length>=4)return;
  v+=k;draw();
  if(v.length===4){
   busy=true;var r=await onDone(v);busy=false;v="";draw();
   if(r&&r.error){subEl.textContent=r.error;subEl.className="sub err"}
  }
 };
 if(cancel)document.getElementById("cx").onclick=cancel;
}
function setup1(msg){pad("Créez votre code PIN",msg||"Choisissez 4 chiffres facile à retenir",async function(p){setup2(p)},null,!!msg)}
function setup2(first){
 pad("Confirmez le PIN","Saisissez-le une deuxième fois",async function(p){
  if(p!==first){setup1("Les deux codes sont différents. Recommencez.");return}
  var s=rnd();store.set("zt_pin",JSON.stringify({s:s,h:await hash(p,s)}));showApp("bord");
 });
}
function lock(){
 unlocked=false;
 pad("Zafnatech Stock","Entrez votre code PIN",async function(p){
  var r=await check(p);if(r.ok){showApp("bord");return}return r;
 });
}
function change1(){
 pad("Code actuel","Entrez votre PIN actuel",async function(p){
  var r=await check(p);if(r.ok){change2();return}return r;
 },function(){showApp("reg")});
}
function change2(){
 pad("Nouveau PIN","Choisissez 4 nouveaux chiffres",async function(p){change3(p)},function(){showApp("reg")});
}
function change3(first){
 pad("Confirmez le nouveau PIN","Saisissez-le une deuxième fois",async function(p){
  if(p!==first){change2();return}
  var s=rnd();store.set("zt_pin",JSON.stringify({s:s,h:await hash(p,s)}));showApp("reg");
 },function(){showApp("reg")});
}
/* ===== Étape 2 : produits ===== */
var SEUIL=30,STATUTS=["En stock","Réservé","Vendu","Retourné","En réparation"],ETATS=["Neuf","Occasion – très bon état","Occasion – bon état","Pour pièces / à réparer"];
var _db,filtre={q:"",s:""};
var cfg=window.FIREBASE_CONFIG,fbOK=false,fdb=null,auth=null,uid=null;
try{if(cfg&&cfg.apiKey){firebase.initializeApp(cfg);auth=firebase.auth();fdb=firebase.firestore();fdb.enablePersistence({synchronizeTabs:true}).catch(function(){});fbOK=true}}catch(e){fbOK=false}
function col(st){return fdb.collection("comptes").doc(uid).collection(st||"produits")}
function newId(){return Date.now()*100+Math.floor(Math.random()*100)}
function clean(o){return JSON.parse(JSON.stringify(o))}
function all(st){return col(st).get().then(function(s){return s.docs.map(function(d){return d.data()})})}
function put(p,st){
 if(!p.id)p.id=newId();
 var r=col(st).doc(String(p.id)).set(clean(p));
 if(navigator.onLine)return r.then(function(){return p.id});
 r.catch(function(){});return Promise.resolve(p.id)
}
function del(id,st){
 var r=col(st).doc(String(id)).delete();
 if(navigator.onLine)return r;
 r.catch(function(){});return Promise.resolve()
}
function E(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fcfa(n){return(Number(n)||0).toLocaleString("fr-FR")+" FCFA"}
function jours(p){return p.dateAchat?Math.max(0,Math.floor((Date.now()-new Date(p.dateAchat).getTime())/864e5)):0}
function reduire(f){return new Promise(function(ok,ko){var im=new Image(),fr=new FileReader();fr.onerror=ko;fr.onload=function(){im.src=fr.result};im.onload=function(){var k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.6))};im.onerror=ko;fr.readAsDataURL(f)})}
async function prodList(){
 var r=E("prod-root");if(!r)return;
 var list;
 try{list=await all()}catch(e){r.innerHTML=card("Stockage indisponible","Cette page ne peut pas enregistrer de données sur ce navigateur.");return}
 r.innerHTML='<button class="btn pri" id="p-add">+ Ajouter un produit</button><input class="in" id="p-q" type="search" placeholder="Rechercher marque, modèle, série, IMEI" value="'+esc(filtre.q)+'"><select class="in" id="p-s"><option value="">Tous les statuts</option>'+STATUTS.map(function(s){return'<option'+(filtre.s===s?" selected":"")+'>'+s+'</option>'}).join("")+'</select><div id="p-list"></div>';
 function fill(){
  var q=filtre.q.toLowerCase();
  var rows=list.filter(function(p){return(!filtre.s||p.statut===filtre.s)&&(!q||[p.marque,p.modele,p.serie,p.imei1,p.imei2].join(" ").toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.id-a.id});
  var h=rows.length?"":card(list.length?"Aucun résultat":"Aucun produit","Appuyez sur « Ajouter un produit » pour enregistrer votre premier article.");
  rows.forEach(function(p){
   var old=jours(p)>SEUIL&&(p.statut==="En stock"||p.statut==="Réservé");
   h+='<div class="item" data-id="'+p.id+'">'+(p.photos&&p.photos[0]?'<img src="'+p.photos[0]+'" alt="">':'<div class="ph">'+(p.type==="tel"?"📱":p.type==="enc"?"🔊":p.type==="chg"?"🔌":p.type==="con"?"🎮":p.type==="bsn"?"🥤":"💻")+'</div>')+'<div><b>'+esc(p.marque)+' '+esc(p.modele)+'</b><p class="m">Achat : '+fcfa(p.prixAchat)+(p.type==="bsn"?' par unité, stock : '+(p.qte||0):"")+'</p><span class="tag">'+p.statut+'</span> '+(old?'<span class="tag warn">⚠ '+jours(p)+' jours en stock</span>':"")+'</div></div>';
  });
  E("p-list").innerHTML=h;
  E("p-list").onclick=function(e){var it=e.target.closest(".item");if(it){var id=Number(it.getAttribute("data-id"));prodForm(list.filter(function(p){return p.id===id})[0])}};
 }
 E("p-q").oninput=function(){filtre.q=this.value;fill()};
 E("p-s").onchange=function(){filtre.s=this.value;fill()};
 E("p-add").onclick=function(){prodForm()};
 fill();
}
function prodForm(p){
 var nw=!p,sure=false;
 p=p||{type:"tel",statut:"En stock",etat:ETATS[1],dateAchat:new Date().toISOString().slice(0,10),photos:[],depenses:[]};
 var ph=p.photos.slice(),dep=p.depenses.slice();
 function sel(l,id,o,v){return'<label class="f">'+l+'<select class="in" id="'+id+'">'+o.map(function(x){var a=x instanceof Array?x:[x,x];return'<option value="'+a[0]+'"'+(a[0]===v?" selected":"")+'>'+a[1]+'</option>'}).join("")+'</select></label>'}
 function inp(l,id,v,t,x){return'<label class="f">'+l+'<input class="in" id="'+id+'" type="'+(t||"text")+'" value="'+esc(v)+'" '+(x||"")+'></label>'}
 var im='inputmode="numeric" maxlength="15"',nu='inputmode="numeric" min="0"';
 E("prod-root").innerHTML='<h2 class="ft">'+(nw?"Nouveau produit":"Modifier le produit")+'</h2>'+
  sel("Type","f-type",[["tel","Téléphone"],["pc","Ordinateur portable"],["enc","Enceinte Bluetooth"],["chg","Chargeur PC"],["con","Console de jeux"],["bsn","Boisson"]],p.type)+
  inp("Marque","f-marque",p.marque)+inp("Modèle","f-modele",p.modele)+
  '<label class="f">Caractéristiques (RAM, stockage, puissance, volume, autonomie…)<textarea class="in" id="f-caract" rows="3">'+esc(p.caract)+'</textarea></label>'+
  sel("État","f-etat",ETATS,p.etat)+
  '<div id="g-pc">'+inp("Numéro de série","f-serie",p.serie)+'</div>'+
  '<div id="g-tel">'+inp("IMEI 1","f-imei1",p.imei1,"text",im)+inp("IMEI 2 (si double SIM)","f-imei2",p.imei2,"text",im)+'</div>'+
  '<div id="g-bsn">'+inp("Quantité en stock (unités)","f-qte",p.qte,"number",nu)+'</div>'+inp("Date d’achat","f-date",p.dateAchat,"date")+inp("Fournisseur","f-four",p.fournisseur)+
  inp("Prix d’achat (FCFA)","f-pa",p.prixAchat,"number",nu)+inp("Prix de vente prévu (FCFA)","f-pp",p.prixPrevu,"number",nu)+
  sel("Statut","f-statut",STATUTS,p.statut)+
  '<div class="f">Photos (4 maximum)<div id="f-ph" class="thumbs"></div><input type="file" id="f-file" accept="image/*" multiple></div>'+
  '<div class="f" id="g-dep">Réparations et autres dépenses<div id="f-dep"></div><div class="row"><input class="in" id="d-l" placeholder="Description"><input class="in" id="d-m" type="number" inputmode="numeric" placeholder="FCFA"></div><button class="btn" id="d-add">+ Ajouter la dépense</button></div>'+
  '<p class="sub err" id="f-err"></p><button class="btn pri" id="f-save">Enregistrer</button><button class="btn" id="f-cx">Annuler</button>'+(nw?"":'<button class="btn dng" id="f-del">Supprimer ce produit</button>');
 function drawPh(){E("f-ph").innerHTML=ph.map(function(s,i){return'<div class="th"><img src="'+s+'" alt=""><button data-i="'+i+'" aria-label="Retirer la photo">×</button></div>'}).join("")}
 function drawDep(){var t=Number(E("f-pa").value)||0;dep.forEach(function(d){t+=d.montant});E("f-dep").innerHTML=dep.map(function(d,i){return'<div class="dl"><span>'+esc(d.label)+'</span><b>'+fcfa(d.montant)+'</b><button data-i="'+i+'" aria-label="Retirer la dépense">×</button></div>'}).join("")+'<p class="m">Coût de revient (achat + dépenses) : <b>'+fcfa(t)+'</b></p>'}
 function tg(){var t=E("f-type").value,b=t==="bsn";E("g-pc").style.display=(t==="tel"||b)?"none":"";E("g-tel").style.display=t==="tel"?"":"none";E("g-bsn").style.display=b?"":"none";E("g-dep").style.display=b?"none":"";E("f-etat").parentNode.style.display=b?"none":"";E("f-pa").parentNode.firstChild.nodeValue=b?"Prix d’achat par unité (FCFA)":"Prix d’achat (FCFA)";E("f-pp").parentNode.firstChild.nodeValue=b?"Prix de vente prévu par unité (FCFA)":"Prix de vente prévu (FCFA)"}
 E("f-type").onchange=tg;E("f-pa").oninput=drawDep;tg();drawPh();drawDep();
 E("f-ph").onclick=function(e){var i=e.target.getAttribute("data-i");if(i!==null){ph.splice(Number(i),1);drawPh()}};
 E("f-dep").onclick=function(e){var i=e.target.getAttribute("data-i");if(i!==null){dep.splice(Number(i),1);drawDep()}};
 E("f-file").onchange=async function(){
  var fs=Array.prototype.slice.call(this.files);
  for(var i=0;i<fs.length&&ph.length<4;i++){try{ph.push(await reduire(fs[i]))}catch(e){E("f-err").textContent="Impossible de charger une photo. Essayez avec une autre image."}}
  this.value="";drawPh();
 };
 E("d-add").onclick=function(){var l=E("d-l").value.trim(),m=Number(E("d-m").value);if(!l||!(m>0)){E("f-err").textContent="Indiquez une description et un montant pour la dépense.";return}E("f-err").textContent="";dep.push({label:l,montant:m});E("d-l").value="";E("d-m").value="";drawDep()};
 E("f-cx").onclick=prodList;
 if(!nw)E("f-del").onclick=async function(){
  if(!sure){sure=true;this.textContent="Appuyez encore pour confirmer la suppression";return}
  await del(p.id);prodList();
 };
 E("f-save").onclick=async function(){
  function g(i){return E(i).value.trim()}
  function er(m){var e=E("f-err");e.textContent=m;e.scrollIntoView({block:"center"})}
  var o=Object.assign({},p,{type:g("f-type"),marque:g("f-marque"),modele:g("f-modele"),caract:g("f-caract"),etat:g("f-etat"),serie:g("f-serie"),imei1:g("f-imei1"),imei2:g("f-imei2"),dateAchat:g("f-date"),fournisseur:g("f-four"),prixAchat:Number(g("f-pa"))||0,prixPrevu:Number(g("f-pp"))||0,statut:g("f-statut"),photos:ph,depenses:dep});
  if(o.type!=="tel"){o.imei1="";o.imei2=""}else{o.serie=""}
  if(o.type==="bsn"){o.serie="";o.depenses=[];o.etat="Neuf";o.qte=Math.floor(Number(g("f-qte"))||0)}
  if(!o.marque||!o.modele)return er("Indiquez la marque et le modèle.");
  if(!o.dateAchat)return er("Indiquez la date d’achat.");
  if(o.type==="bsn"&&g("f-qte")==="")return er("Indiquez la quantité en stock.");
  if((o.imei1&&!/^\d{15}$/.test(o.imei1))||(o.imei2&&!/^\d{15}$/.test(o.imei2)))return er("Un IMEI contient exactement 15 chiffres.");
  try{
   var cles=[o.serie,o.imei1,o.imei2].filter(Boolean),autres=await all();
   var dup=autres.filter(function(q){return q.id!==o.id&&[q.serie,q.imei1,q.imei2].some(function(k){return k&&cles.indexOf(k)>-1})})[0];
   if(dup)return er("Ce numéro est déjà enregistré pour : "+dup.marque+" "+dup.modele+".");
   if(nw)o.creeLe=Date.now();
   await put(o);prodList();
  }catch(e){er("Enregistrement impossible. Vérifiez l’espace de stockage du téléphone.")}
 };
 window.scrollTo(0,0);
}
/* ===== Étape 3 : ventes ===== */
var MODES=['Espèces','Mobile Money','Autre'];
function today(){return new Date().toISOString().slice(0,10)}
function coutDe(p){return(p.prixAchat||0)+(p.depenses||[]).reduce(function(a,d){return a+d.montant},0)}
function paye(v){return v.paiements.reduce(function(a,x){return a+x.montant},0)}
function dfr(d){return d?new Date(d).toLocaleDateString('fr-FR'):''}
function modeOpts(){return MODES.map(function(m){return'<option>'+m+'</option>'}).join('')}
function ventErr(m){var e=E('f-err');if(e){e.textContent=m;e.scrollIntoView({block:'center'})}}
async function ventList(){
 var r=E('vent-root');if(!r)return;
 var vs,ps;
 try{vs=await all('ventes');ps=await all()}catch(e){r.innerHTML=card('Stockage indisponible','Impossible d’ouvrir la base de données.');return}
 var map={};ps.forEach(function(p){map[p.id]=p});
 var dispo=ps.filter(function(p){return p.statut==='En stock'||p.statut==='Réservé'});
 vs.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
 var h='<button class="btn pri" id="v-add">+ Enregistrer une vente</button>';
 if(!vs.length)h+=card('Aucune vente','Choisissez un article en stock pour enregistrer votre première vente.');
 vs.forEach(function(v){
  var p=map[v.produitId],m=v.prix-coutV(v,p),reste=v.prix-paye(v);
  h+='<div class="item" data-id="'+v.id+'"><div><b>'+esc(v.nom)+(v.qte?' × '+v.qte:'')+'</b><p class="m">'+dfr(v.date)+(v.client?', '+esc(v.client):'')+'</p><p class="m">Vendu '+fcfa(v.prix)+', marge '+fcfa(m)+'</p>'+(reste>0?'<span class="tag warn">Reste à payer : '+fcfa(reste)+'</span>':'<span class="tag">Soldé</span>')+'</div></div>';
 });
 r.innerHTML=h;
 E('v-add').onclick=function(){ventForm(dispo)};
 r.onclick=function(e){var it=e.target.closest('.item');if(it){var id=Number(it.getAttribute('data-id'));var v=vs.filter(function(x){return x.id===id})[0];ventDetail(v,map[v.produitId])}};

function ventForm(dispo){
 var r=E('vent-root'),enc=false;
 if(!dispo.length){r.innerHTML=card('Aucun article disponible','Ajoutez d’abord un produit « En stock » ou « Réservé » dans l’onglet Produits.')+'<button class="btn" id="f-cx">Retour</button>';E('f-cx').onclick=ventList;return}
 r.innerHTML='<h2 class="ft">Nouvelle vente</h2><label class="f">Article<select class="in" id="v-p">'+dispo.map(function(p){return'<option value="'+p.id+'">'+esc(p.marque+' '+p.modele)+(p.serie?' (série '+esc(p.serie)+')':'')+(p.imei1?' (IMEI '+esc(p.imei1)+')':'')+(isB(p)?' (stock : '+(p.qte||0)+')':'')+'</option>'}).join('')+'</select></label>'+
  '<label class="f">Date de la vente<input class="in" id="v-d" type="date" value="'+today()+'"></label>'+
  '<div id="v-qg"><label class="f">Quantité vendue<input class="in" id="v-q" type="number" inputmode="numeric" min="1" value="1"></label></div><label class="f"><span id="v-pl">Prix de vente réel (FCFA)</span><input class="in" id="v-prix" type="number" inputmode="numeric" min="0"></label>'+
  '<div class="card"><p id="v-m"></p></div>'+
  '<label class="f">Nom du client (facultatif)<input class="in" id="v-c"></label>'+
  '<label class="f">Contact du client (facultatif)<input class="in" id="v-t" type="tel"></label>'+
  '<label class="f">Montant encaissé maintenant (FCFA)<input class="in" id="v-enc" type="number" inputmode="numeric" min="0"></label>'+
  '<label class="f">Mode de paiement<select class="in" id="v-mode">'+modeOpts()+'</select></label>'+
  '<p class="sub err" id="f-err"></p><button class="btn pri" id="f-save">Enregistrer la vente</button><button class="btn" id="f-cx">Annuler</button>';
 function cur(){var id=Number(E('v-p').value);return dispo.filter(function(p){return p.id===id})[0]}
 function maj(){var p=cur(),b=isB(p),n=b?(Number(E('v-q').value)||0):1,px=(Number(E('v-prix').value)||0)*n,c=b?n*(p.prixAchat||0):coutDe(p);E('v-qg').style.display=b?'':'none';E('v-pl').textContent=b?'Prix de vente par unité (FCFA)':'Prix de vente réel (FCFA)';E('v-m').innerHTML=(b?'Total de la vente : <b>'+fcfa(px)+'</b><br>':'')+'Coût de revient : <b>'+fcfa(c)+'</b><br>Marge réelle : <b>'+fcfa(px-c)+'</b>';if(!enc)E('v-enc').value=px}
 E('v-p').onchange=function(){E('v-prix').value=cur().prixPrevu||'';enc=false;maj()};
 E('v-prix').oninput=maj;E('v-q').oninput=maj;
 E('v-enc').oninput=function(){enc=true};
 E('v-prix').value=cur().prixPrevu||'';maj();
 E('f-cx').onclick=ventList;
 E('f-save').onclick=async function(){
  var p=cur(),b=isB(p),n=b?Math.floor(Number(E('v-q').value)||0):1,px=(Number(E('v-prix').value)||0)*n,en=Number(E('v-enc').value)||0,d=E('v-d').value;
  if(!d)return ventErr('Indiquez la date de la vente.');
  if(b&&(n<1||n>(p.qte||0)))return ventErr('La quantité doit être comprise entre 1 et '+(p.qte||0)+'.');
  if(!(px>0))return ventErr('Indiquez le prix de vente réel.');
  if(en<0||en>px)return ventErr('Le montant encaissé doit être compris entre 0 et le prix de vente.');
  try{
   await put({produitId:p.id,nom:p.marque+' '+p.modele,date:d,prix:px,cout:b?n*(p.prixAchat||0):coutDe(p),qte:b?n:0,client:E('v-c').value.trim(),contact:E('v-t').value.trim(),paiements:en>0?[{date:d,montant:en,mode:E('v-mode').value}]:[],creeLe:Date.now()},'ventes');
   if(b){p.qte=(p.qte||0)-n;if(p.qte<=0)p.statut='Vendu'}else{p.statut='Vendu'}p.prixReel=b?Number(E('v-prix').value):px;p.dateVente=d;await put(p);
   ventList();
  }catch(e){ventErr('Enregistrement impossible. Vérifiez l’espace de stockage du téléphone.')}

function ventDetail(v,p){
 var sure=false;
 function draw(){
  var cout=coutV(v,p),reste=v.prix-paye(v);
  E('vent-root').innerHTML='<h2 class="ft">'+esc(v.nom)+(v.qte?' × '+v.qte:'')+'</h2><div class="card"><p>Vente du '+dfr(v.date)+'</p>'+(v.client?'<p>Client : <b>'+esc(v.client)+'</b>'+(v.contact?', '+esc(v.contact):'')+'</p>':'')+'<p>Prix de vente : <b>'+fcfa(v.prix)+'</b></p><p>Coût de revient : <b>'+fcfa(cout)+'</b></p><p>Marge réelle : <b>'+fcfa(v.prix-cout)+'</b></p></div>'+
   '<div class="card"><h2>Paiements</h2>'+(v.paiements.length?v.paiements.map(function(x){return'<div class="dl"><span>'+dfr(x.date)+', '+esc(x.mode)+'</span><b>'+fcfa(x.montant)+'</b></div>'}).join(''):'<p>Aucun paiement reçu.</p>')+'<p class="m">'+(reste>0?'Reste à payer : <b>'+fcfa(reste)+'</b>':'Vente soldée')+'</p></div>'+
   (reste>0?'<div class="card"><h2>Ajouter un paiement</h2><label class="f">Montant (FCFA)<input class="in" id="a-m" type="number" inputmode="numeric" value="'+reste+'"></label><label class="f">Mode de paiement<select class="in" id="a-mode">'+modeOpts()+'</select></label><button class="btn pri" id="a-add">Enregistrer le paiement</button></div>':'')+
   '<p class="sub err" id="f-err"></p><button class="btn" id="f-cx">Retour à la liste</button><button class="btn dng" id="s-del">Annuler cette vente</button>';
  E('f-cx').onclick=ventList;
  var a=E('a-add');
  if(a)a.onclick=async function(){
   var m=Number(E('a-m').value);
   if(!(m>0)||m>reste)return ventErr('Le montant doit être compris entre 1 et '+reste+' FCFA.');
   v.paiements.push({date:today(),montant:m,mode:E('a-mode').value});
   try{await put(v,'ventes');draw()}catch(e){ventErr('Enregistrement impossible.')}
  };
  E('s-del').onclick=async function(){
   if(!sure){sure=true;this.textContent='Appuyez encore : le produit repasse « En stock »';return}
   await del(v.id,'ventes');
   if(p){if(v.qte)p.qte=(p.qte||0)+v.qte;p.statut='En stock';p.prixReel=null;p.dateVente=null;await put(p)}
   ventList();
  };
  window.scrollTo(0,0);
 }
 draw();
}

 var ca=0,brut=0,net=0,enc=0,reste=0;
 vp.forEach(function(v){var p=map[v.produitId];ca+=v.prix;brut+=v.prix-((v.qte||!p)?v.cout:(p.prixAchat||0));net+=v.prix-coutV(v,p);enc+=paye(v)});
 vs.forEach(function(v){reste+=v.prix-paye(v)});

 var val=stock.reduce(function(a,p){return a+(p.prixAchat||0)*nb(p)},0),nbS=stock.reduce(function(a,p){return a+nb(p)},0);
 var par={};stock.forEach(function(p){par[p.statut]=(par[p.statut]||0)+nb(p)});
 var vieux=stock.filter(function(p){return(p.statut==='En stock'||p.statut==='Réservé')&&jours(p)>SEUIL}).sort(function(a,b){return jours(b)-jours(a)});
 function t(l,v,w){return'<div class="tile'+(w?' w2':'')+'"><span>'+l+'</span><b>'+v+'</b></div>'}
 var h='';

 h+=rappel(ps.length)+'<p class="gt">Stock</p><div class="grid">'+t('Articles en stock',nbS)+t('Valeur au prix d’achat',fcfa(val))+'</div>';
 var det=STATUTS.filter(function(s){return par[s]}).map(function(s){return s+' : '+par[s]}).join(', ');
 if(det)h+='<p class="m">'+det+'</p>';
 h+='<p class="gt">Ventes</p><select class="in" id="b-p" style="margin-bottom:10px"><option value="tout"'+(periode==='tout'?' selected':'')+'>Toutes les ventes</option><option value="mois"'+(periode==='mois'?' selected':'')+'>Ce mois-ci</option></select>'+
  '<div class="grid">'+t('Chiffre d’affaires',fcfa(ca),1)+t('Produits vendus',vp.reduce(function(a,v){return a+(v.qte||1)},0))+t('Encaissé',fcfa(enc))+t('Bénéfice brut',fcfa(brut))+t('Bénéfice après dépenses',fcfa(net))+t('Reste à encaisser (toutes ventes)',fcfa(reste),1)+'</div>'+
  '<p class="m">Brut = vente − prix d’achat. Après dépenses = brut − réparations et autres dépenses.</p>'+
  '<p class="gt">Alertes</p>';
 if(!vieux.length)h+=card('Aucune alerte','Aucun article n’est en stock depuis plus de '+SEUIL+' jours.');
 else h+='<div class="card"><h2>'+vieux.length+' article'+(vieux.length>1?'s':'')+' en stock depuis plus de '+SEUIL+' jours</h2>'+vieux.slice(0,10).map(function(p){return'<div class="dl"><span>'+esc(p.marque+' '+p.modele)+'</span><b>'+jours(p)+' jours</b></div>'}).join('')+(vieux.length>10?'<p class="m">et '+(vieux.length-10)+' autres dans l’onglet Produits.</p>':'')+'</div>';
 r.innerHTML=h;
 E('b-p').onchange=function(){periode=this.value;bordInit()};
}

function dl(name,type,text){var b=new Blob([text],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},3000)}
function csv(rows){return '\uFEFF'+rows.map(function(r){return r.map(function(c){c=c==null?'':String(c);return'"'+c.replace(/"/g,'""')+'"'}).join(';')}).join('\r\n')}
function txt(s){return s?'="'+s+'"':''}
function rappel(n){var d=store.get('zt_bk');if(!n)return'';var j=d?Math.floor((Date.now()-new Date(d).getTime())/864e5):999;return j>7?'<div class="card"><h2>Pensez à sauvegarder</h2><p>'+(d?'Dernière sauvegarde il y a '+j+' jours.':'Vous n’avez encore jamais fait de sauvegarde.')+' Ouvrez Réglages pour en créer une.</p></div>':''}
function backupUI(){var d=store.get('zt_bk'),u=auth&&auth.currentUser;return'<div class="card"><h2>Compte de la boutique</h2><p>Connecté : <b>'+esc(u?u.email:'')+'</b><br>Tous les téléphones connectés avec cet e-mail partagent les mêmes données.</p></div><button class="btn" id="b-out">Se déconnecter</button><div class="card"><h2>Sauvegarde et transfert</h2><p>Dernière sauvegarde : <b>'+(d?dfr(d):'jamais')+'</b>. Le fichier contient tous vos produits, photos et ventes, mais pas le PIN. Il n’est pas chiffré : gardez-le en lieu sûr. Pour changer de téléphone, connectez-vous simplement avec le même e-mail : les données sont dans le cloud. La sauvegarde reste utile en cas d’erreur.</p></div><button class="btn" id="b-save">💾 Créer une sauvegarde complète</button><button class="btn" id="b-rest">📥 Restaurer une sauvegarde</button><input type="file" id="b-file" accept=".json,application/json" hidden><button class="btn" id="b-csvp">📄 Exporter les produits (Excel/CSV)</button><button class="btn" id="b-csvv">📄 Exporter les ventes (Excel/CSV)</button><div class="sub" id="b-msg"></div>'}
async function restaurer(d){
 if(!navigator.onLine)throw new Error("hors ligne");
 var ops=[];
 (await all("produits")).forEach(function(x){ops.push(["d","produits",x])});
 (await all("ventes")).forEach(function(x){ops.push(["d","ventes",x])});
 d.produits.forEach(function(x){ops.push(["s","produits",x])});
 d.ventes.forEach(function(x){ops.push(["s","ventes",x])});
 for(var i=0;i<ops.length;i+=300){
  var b=fdb.batch();
  ops.slice(i,i+300).forEach(function(o){
   if(o[0]==="d"){b.delete(col(o[1]).doc(String(o[2].id)))}
   else{if(!o[2].id)o[2].id=newId();b.set(col(o[1]).doc(String(o[2].id)),clean(o[2]))}
  });
  await b.commit();
 }
}

 function go(create){
  var e=E("l-e").value.trim(),p=E("l-p").value,m=E("l-m");
  if(!e||!p){m.textContent="Saisissez l’e-mail et le mot de passe.";m.className="sub err";return}
  if(busy)return;busy=true;m.textContent="Connexion…";m.className="sub";
  (create?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).then(function(){busy=false},function(er){busy=false;m.textContent=fbErr(er);m.className="sub err"});
 }
 E("l-in").onclick=function(){go(false)};
 E("l-new").onclick=function(){go(true)};
}
if(!fbOK){app.innerHTML='<div class="lock"><div class="logo">Z</div><h1>Cloud non configuré</h1><p class="sub">Impossible de démarrer le service en ligne. Vérifiez la connexion internet et le fichier firebase-config.js.</p></div>'}
else auth.onAuthStateChanged(function(u){
 if(u){uid=u.uid;if(saved())lock();else setup1()}
 else{uid=null;showLogin()}
});

})();
</script>
</body>
</html>
